name: CD Deployment Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # Required for requesting JWT from GitHub OIDC provider
  contents: read

jobs:
  deploy:
    name: Deploy Infrastructure & Serverless Handlers
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Terraform Init
        run: terraform -chdir=infrastructure/terraform init

      - name: Terraform Plan
        run: terraform -chdir=infrastructure/terraform plan -no-color

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform -chdir=infrastructure/terraform apply -auto-approve
